name: Coverage check

on:
  push:
    branches:
      - 'coverage/**'
  workflow_dispatch:

jobs:
  test-and-coverage:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Toolchain details
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build

      - name: Run tests with coverage
        run: swift test --enable-code-coverage

      - name: Locate coverage artifacts
        if: always()
        run: |
          BIN_PATH="$(swift build --show-bin-path)"
          echo "BIN_PATH=${BIN_PATH}" | tee -a "$GITHUB_ENV"
          echo "--- contents of bin path ---"
          ls -la "${BIN_PATH}" || true
          echo "--- codecov dir ---"
          ls -la "${BIN_PATH}/codecov" || true
          echo "--- xctest bundles ---"
          find "${BIN_PATH}" -maxdepth 1 -name '*.xctest' || true

      - name: Coverage report
        if: always()
        run: |
          BIN_PATH="$(swift build --show-bin-path)"
          PROFDATA="${BIN_PATH}/codecov/default.profdata"
          XCTEST_BUNDLE="$(find "${BIN_PATH}" -maxdepth 1 -name '*.xctest' | head -1)"

          if [ -z "${XCTEST_BUNDLE}" ]; then
            echo "no .xctest bundle found under ${BIN_PATH}"
            exit 1
          fi

          BUNDLE_NAME="$(basename "${XCTEST_BUNDLE}" .xctest)"
          BINARY="${XCTEST_BUNDLE}/Contents/MacOS/${BUNDLE_NAME}"
          if [ ! -f "${BINARY}" ]; then
            BINARY="${XCTEST_BUNDLE}/${BUNDLE_NAME}"
          fi

          echo "binary  = ${BINARY}"
          echo "profdata= ${PROFDATA}"
          ls -la "${BINARY}"
          ls -la "${PROFDATA}"

          echo "=== PER-FILE COVERAGE (Sources only) ==="
          xcrun llvm-cov report "${BINARY}" \
            -instr-profile "${PROFDATA}" \
            -ignore-filename-regex='(\.build|Tests)/'

          echo "=== LCOV EXPORT ==="
          xcrun llvm-cov export "${BINARY}" \
            -instr-profile "${PROFDATA}" \
            -format=lcov \
            -ignore-filename-regex='(\.build|Tests)/' \
            > coverage.lcov
          wc -l coverage.lcov

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage.lcov
          if-no-files-found: warn
